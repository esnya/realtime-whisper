

[metadata]
name = realtime_whisper
version = 0.8.1
description = Automatic speech recognition (ASR) by Whisper from OpenAI in real-time audio stream through WebSocket.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = esnya
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3.11

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    accelerate
    numpy
    optimum
    pydantic
    pydantic-settings
    safetensors
    torch>=2.6,<3
    torchaudio>=2.6,<3
    transformers>=4.48.3,<4.49
    websockets

[options.extras_require]
dev =
    bandit
    datasets
    librosa
    numba
    numpy
    pyaudio

[options.packages.find]
where = src
